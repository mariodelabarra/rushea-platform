
services:
  db:
    image: postgres:18
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    container_name: rushea_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_ROOT_PASSWORD: rootpassword
      POSTGRES_DATABASE: rushea
      POSTGRES_PASSWORD: Testing99
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d dotnetHero"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: